baseURL = "https://limjongtae.github.io/gonggoboda-blog/"
languageCode = "ko-KR"
defaultContentLanguage = "ko"
title = "공고보다 (GonggoBoda)"

theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  env = "production"
  description = "AI 가 매일 큐레이션하는 지원사업·입찰·창업공고. 출처는 공공데이터포털."
  author = "GonggoBoda"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowRssButtonInSectionTermList = true
  ShowToc = false

  # 검색엔진 사이트 인증 (head 에 메타태그 자동 삽입)
  [params.assets]
    customHeadHTML = '''
<meta name="google-site-verification" content="HrBm7lmqx6spILA5QeU-5gTRAXHZPYqoR2Uz3jTER7Y" />
'''

  [params.homeInfoParams]
    Title = "📋 공고보다"
    Content = """
### 오늘 신청 가능한 지원사업·입찰을 매일 큐레이션

매일 아침 **08:30 KST** — 공공데이터포털 3 출처 통합 풀에서 **분야별 균형 5선** 자동 발행.

<div style="background:#f6f8fa;border:1px solid #e1e4e8;padding:20px;border-radius:8px;margin:24px 0;text-align:center;">
  <div style="font-size:15px;margin-bottom:12px;"><strong>📮 매일 메일로 받기</strong></div>
  <a href="/gonggoboda-blog/subscribe/" style="display:inline-block;background:#0366d6;color:white;padding:12px 28px;border-radius:6px;font-weight:600;text-decoration:none;font-size:15px;">무료 구독하기 →</a>
  <div style="font-size:12px;color:#666;margin-top:10px;">매일 8:30 도착 · 광고 없음 · 언제든 해지</div>
</div>

#### 📊 매일 자동 갱신
- **약 400~700건/일** — 3 출처 통합 + 중복 제거 후 풀
- **분야별 5선** — 창업·사업화 / R&D·기술 / 자금·금융 / 판로·수출 / 인력·고용 / 시설·보육 / 인증·특허 / 입찰
- **D-day 우선** — 마감 임박 + 신규 공고 우선 노출

#### 🔗 출처
- 중소벤처기업부 (기업마당) — 중소기업 지원사업 공고
- 창업진흥원 — K-Startup 사업공고
- 조달청 — 나라장터 입찰공고

> ⚠️ 신청 자격·마감일·세부 조건은 반드시 **원문 링크** 에서 직접 확인하세요. 본 큐레이션은 정보 안내용입니다.
"""

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[outputs]
  home = ["HTML", "RSS", "JSON"]

# 상단 메뉴
[[menu.main]]
  identifier = "subscribe"
  name = "구독"
  url = "/subscribe/"
  weight = 10
[[menu.main]]
  identifier = "about"
  name = "소개"
  url = "/about/"
  weight = 20

[markup.goldmark.renderer]
  unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"

# 한국어 페이지네이션 / SEO
[pagination]
  pagerSize = 10

[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.5

# Naver 서치어드바이저 / Google Search Console 인증 메타태그는 build 시 사용자가 추가
